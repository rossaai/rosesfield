# Puts Rosesfield on Cloudflare in public mode from GitHub, per
# docs/self-host.md §From GitHub Actions. A published release deploys, and Run
# workflow deploys main again. Public mode holds no Comfy key: each visitor
# brings their own. The job runs only in a repository that sets the variable
# CLOUDFLARE_ACCOUNT_ID, so a fork deploys nothing until it sets its own.
name: Deploy

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    if: vars.CLOUDFLARE_ACCOUNT_ID != ''
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
      DOMAIN: ${{ vars.DOMAIN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: bun install --frozen-lockfile
      - run: bun run build

      - name: Create the bucket and the database when missing
        working-directory: services/gateway
        run: |
          bunx wrangler r2 bucket info rosesfield-assets > /dev/null 2>&1 \
            || bunx wrangler r2 bucket create rosesfield-assets --update-config=false
          bunx wrangler d1 info rosesfield > /dev/null 2>&1 \
            || bunx wrangler d1 create rosesfield --update-config=false
          bunx wrangler d1 migrations apply rosesfield --remote

      - name: Deploy the Worker
        working-directory: services/gateway
        run: |
          if [ -n "$DOMAIN" ]; then
            bunx wrangler deploy --domain "$DOMAIN"
          else
            bunx wrangler deploy
          fi

      - name: Set the session secret when missing
        working-directory: services/gateway
        run: |
          listed="$(bunx wrangler secret list --format json)"
          if ! printf '%s' "${listed#"${listed%%[*}"}" | jq -e 'any(.[]; .name == "SESSION_SECRET")' > /dev/null; then
            openssl rand -hex 32 | bunx wrangler secret put SESSION_SECRET
          fi

      - name: Check the live address
        if: env.DOMAIN != ''
        run: |
          for path in / /api/runs /privacy; do
            curl --silent --show-error --fail --retry 12 --retry-delay 5 --retry-all-errors \
              --output /dev/null "https://$DOMAIN$path"
            echo "https://$DOMAIN$path answers 200"
          done
